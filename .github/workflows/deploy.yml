name: Deploy to S3

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allows manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print working directory
        run: pwd

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # s3-bucket-user key ID
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # s3-bucket-user access key
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          pwd
          # Sync files from staticwebsite directory to S3 bucket
          aws s3 sync ../../staticwebsite/ s3://epam-staticwebsite-bucket/ --delete
          
          # Set proper content types for common file types
          aws s3 cp s3://epam-staticwebsite-bucket/ s3://epam-staticwebsite-bucket/ \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --content-type "text/html" \
            --metadata-directive REPLACE
          
          aws s3 cp s3://epam-staticwebsite-bucket/ s3://epam-staticwebsite-bucket/ \
            --recursive \
            --exclude "*" \
            --include "*.css" \
            --content-type "text/css" \
            --metadata-directive REPLACE
          
          aws s3 cp s3://epam-staticwebsite-bucket/ s3://epam-staticwebsite-bucket/ \
            --recursive \
            --exclude "*" \
            --include "*.js" \
            --content-type "application/javascript" \
            --metadata-directive REPLACE
          
          aws s3 cp s3://epam-staticwebsite-bucket/ s3://epam-staticwebsite-bucket/ \
            --recursive \
            --exclude "*" \
            --include "*.json" \
            --content-type "application/json" \
            --metadata-directive REPLACE

      - name: Deployment complete
        run: |
          pwd
          echo "✅ Deployment to S3 completed successfully!"
          echo "Website URL: http://epam-staticwebsite-bucket.s3-website-$(aws configure get region).amazonaws.com"

